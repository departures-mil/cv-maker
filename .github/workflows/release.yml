name: Build and release

# A release is made whenever package.json lands on main with a version that has no release yet.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists != '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.exists != '1'
        run: npm ci
      - name: Build portable exe
        if: steps.v.outputs.exists != '1'
        run: node scripts/build.js
      - name: Publish GitHub release
        if: steps.v.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          cp "dist/CV Maker v${VER}.exe" "dist/CV-Maker-v${VER}.exe"
          gh release create "v${VER}" "dist/CV-Maker-v${VER}.exe" --target "$GITHUB_SHA" --title "CV Maker v${VER}" --notes-file release-notes.md --latest
