name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable exe
        run: node scripts/build.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SRC="dist/CV Maker v${VER}.exe"
          OUT="dist/CV-Maker-v${VER}.exe"
          cp "$SRC" "$OUT"
          gh release create "$GITHUB_REF_NAME" "$OUT" --title "CV Maker $GITHUB_REF_NAME" --notes-file release-notes.md --latest
